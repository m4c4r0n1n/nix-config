[package]
name = "nix-config-tools"
version = "0.1.0"
edition = "2021"

[lib]
name = "tools"
path = "src/lib.rs"

[dependencies]
brotli-decompressor = "4"
html-escape = "0.2"
libc = "0.2"
mime_guess = "2"
regex = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha1_smol = "1"
tiny_http = "0.12"
toml = { version = "0.8", features = ["preserve_order"] }
ureq = "2"

[profile.release]
lto = true
strip = true
